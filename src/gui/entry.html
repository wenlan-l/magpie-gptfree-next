<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT号池</title>
  <script src="_magpie/bridge.js"></script>
  <script src="entry.js" defer></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { font: 14px/1.65 -apple-system, "Segoe UI", system-ui, sans-serif; }
    #boot {
      position: fixed; inset: 0; display: grid; place-content: center; gap: 8px;
      justify-items: center; text-align: center; padding: 24px;
      background: var(--magpie-bg, Canvas); color: var(--magpie-fg, CanvasText);
    }
    #boot[hidden] { display: none; }
    .pulse {
      display: block; margin-bottom: 10px; width: 24px; height: 24px;
      border: 2px solid #7775; border-top-color: #4796eb; border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 15px; font-weight: 600; margin: 0; }
    p { margin: 0; color: var(--magpie-muted, GrayText); max-width: 46ch; }
    button {
      font: inherit; padding: 5px 14px; border-radius: 8px; cursor: pointer;
      border: 1px solid #8884; background: #8881; color: inherit;
    }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="boot">
    <span class="pulse" aria-hidden="true"></span>
    <h2>GPT号池</h2>
    <p id="state">正在连接本地服务…</p>
    <button id="retry" type="button" hidden>重新连接</button>
  </main>
</body>
</html>
